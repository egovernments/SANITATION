config:
  #Municipal Services

  - name: 'builds/SANITATION/fsm'
    build:
      - work-dir: 'fsm'
        image-name: 'fsm'
        dockerfile: 'build/maven/Dockerfile'
      - work-dir: 'fsm/src/main/resources/db'
        image-name: 'fsm-db'

  - name: 'builds/SANITATION/vehicle'
    build:
